server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # static file should fall back to index.html, or refreshing on e.g.
    # /history returns a raw Nginx 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
