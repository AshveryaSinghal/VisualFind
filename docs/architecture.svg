<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#0f172a"/>
  <text x="40" y="45" fill="#f8fafc" font-size="24" font-weight="700">VisualFind — Architecture</text>
  <text x="40" y="68" fill="#94a3b8" font-size="13">Two entry points, one shared pricing pipeline, one source of truth for what's "real".</text>

  <!-- Entry points -->
  <rect x="40" y="100" width="230" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="126" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Search by Image</text>
  <text x="155" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">React upload → FastAPI</text>

  <rect x="300" y="100" width="230" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="415" y="126" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Describe What You Need</text>
  <text x="415" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">Chat → Gemini → structured query</text>

  <!-- Cloudinary -->
  <rect x="40" y="200" width="230" height="55" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="224" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Cloudinary</text>
  <text x="155" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">public URL for SerpApi to fetch</text>

  <!-- SerpApi Lens -->
  <rect x="40" y="295" width="230" height="55" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="319" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">SerpApi Google Lens</text>
  <text x="155" y="337" fill="#94a3b8" font-size="11" text-anchor="middle">product ID + candidate links</text>

  <!-- Convergence point: shared pipeline -->
  <rect x="180" y="390" width="440" height="55" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="414" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Shared pricing pipeline (identical for both entry points)</text>
  <text x="400" y="432" fill="#94a3b8" font-size="11" text-anchor="middle">search_service.py / price_service.py</text>

  <!-- Domain filter -->
  <rect x="180" y="480" width="205" height="55" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="282" y="504" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">Domain allowlist filter</text>
  <text x="282" y="522" fill="#94a3b8" font-size="10.5" text-anchor="middle">anti-scam layer</text>

  <!-- Query builder -->
  <rect x="415" y="480" width="205" height="55" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="517" y="504" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">Query builder</text>
  <text x="517" y="522" fill="#94a3b8" font-size="10.5" text-anchor="middle">cascading fallback</text>

  <!-- Price extraction pipeline -->
  <rect x="180" y="565" width="440" height="90" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="588" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">PriceExtractionService — 7 tiers, stop at first success</text>
  <text x="400" y="608" fill="#94a3b8" font-size="10.5" text-anchor="middle">1 Google Shopping → 1.5 Lens price → 2 structured metadata (JSON-LD)</text>
  <text x="400" y="624" fill="#94a3b8" font-size="10.5" text-anchor="middle">→ 3 headless browser (optional) → 4 normalize → 5 validate → 6 select real price</text>
  <text x="400" y="642" fill="#64748b" font-size="10" text-anchor="middle">every tier exception-safe · never raises · all-null on total failure, not a guess</text>

  <!-- Output -->
  <rect x="180" y="680" width="205" height="55" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="282" y="704" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">SQLite</text>
  <text x="282" y="722" fill="#94a3b8" font-size="10.5" text-anchor="middle">history + analytics + TTL cache</text>

  <rect x="415" y="680" width="205" height="55" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="517" y="704" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">JSON response</text>
  <text x="517" y="722" fill="#94a3b8" font-size="10.5" text-anchor="middle">ranked, deduped, best-deal marked</text>

  <!-- Gemini rank branch -->
  <rect x="680" y="390" width="230" height="90" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="795" y="416" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Gemini (2nd call)</text>
  <text x="795" y="436" fill="#94a3b8" font-size="10.5" text-anchor="middle">ranks the real results</text>
  <text x="795" y="452" fill="#94a3b8" font-size="10.5" text-anchor="middle">recommends strictly by</text>
  <text x="795" y="468" fill="#94a3b8" font-size="10.5" text-anchor="middle">index into that real list</text>

  <rect x="680" y="565" width="230" height="55" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="795" y="589" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">Recommendation Card</text>
  <text x="795" y="607" fill="#94a3b8" font-size="10.5" text-anchor="middle">can never cite a product not found</text>

  <!-- Arrows -->
  <line x1="155" y1="160" x2="155" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="155" y1="255" x2="155" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="350" x2="330" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="160" x2="700" y2="390" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,4"/>

  <line x1="330" y1="445" x2="282" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="445" x2="517" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="282" y1="535" x2="350" y2="565" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="517" y1="535" x2="450" y2="565" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="350" y1="655" x2="282" y2="680" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="655" x2="517" y2="680" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="517" y1="735" x2="700" y2="480" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,4"/>
  <line x1="795" y1="480" x2="795" y2="565" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="900" y1="700" x2="930" y2="700" stroke="#475569" stroke-width="2"/>
  <text x="938" y="704" fill="#94a3b8" font-size="11">image-search path</text>
  <line x1="900" y1="720" x2="930" y2="720" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="938" y="724" fill="#94a3b8" font-size="11">AI-assistant-only path</text>
</svg>
