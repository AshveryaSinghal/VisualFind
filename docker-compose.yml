# Runs the full stack locally with one command:
#   docker compose up --build
# Frontend: http://localhost:5173   Backend: http://localhost:8000/docs
#
# Note: SerpApi still needs a publicly reachable URL to fetch uploaded
# images (see README.md#why-ngrok-is-needed). For real image-search testing
# against a Dockerized backend, set PUBLIC_BASE_URL in .env to an ngrok
# tunnel or your real deployed URL - Docker alone doesn't solve that part.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./static/uploads:/app/static/uploads
      - visualfind_db:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  visualfind_db:
